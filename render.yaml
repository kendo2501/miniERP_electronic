services:
  - type: web
    name: mini-erp-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: APP_NAME
        value: mini-erp
      - key: DATABASE_URL
        fromDatabase:
          name: mini-erp-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        value: mini-erp-jwt-secret-prod-2024-secure-key-abc123xyz
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: JWT_REFRESH_SECRET
        value: mini-erp-refresh-secret-prod-2024-secure-key-def456uvw
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: CORS_ORIGIN
        value: https://mini-erp-electronic.up.railway.app

databases:
  - name: mini-erp-db
    plan: free
    databaseName: mini_erp
